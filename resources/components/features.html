<section class="relative w-full max-w-[1200px] px-8 mx-auto py-24 flex flex-col items-center">
  <div class="mb-20 text-center w-full">
    <h2 class="text-4xl md:text-5xl font-bold text-white tracking-tight mb-4">Estadísticas y <span class="text-[#89F336]">Seguridad</span>.</h2>
    <p class="text-gray-400 max-w-2xl mx-auto text-lg">Los números que respaldan nuestro trabajo y la tecnología que protege nuestra comunidad.</p>
  </div>

  <!-- Contenedor principal -->
  <div class="w-full flex items-center justify-center mt-10">
    
    <div class="relative flex items-center justify-center w-full max-w-[340px]">
      
      <!-- Floating Pills (Left side) -->
      <div class="hidden lg:flex flex-col gap-6 absolute top-1/2 -left-[240px] -translate-y-1/2 z-20">
        <div class="bg-[#111217] border border-white/5 shadow-2xl rounded-2xl p-3 pr-6 flex items-center gap-4 hover:scale-105 transition-transform cursor-pointer group whitespace-nowrap ml-8">
          <div class="w-10 h-10 rounded-full bg-purple-600/20 flex items-center justify-center text-purple-500 text-xl group-hover:bg-purple-600/30 transition-colors"><i class="bi bi-code-slash"></i></div>
          <span class="text-white font-bold text-sm tracking-wide">Desarrollo de Plugins</span>
        </div>
        <div class="bg-[#111217] border border-white/5 shadow-2xl rounded-2xl p-3 pr-6 flex items-center gap-4 hover:scale-105 transition-transform cursor-pointer group whitespace-nowrap">
          <div class="w-10 h-10 rounded-full bg-pink-600/20 flex items-center justify-center text-pink-500 text-xl group-hover:bg-pink-600/30 transition-colors"><i class="bi bi-box-seam"></i></div>
          <span class="text-white font-bold text-sm tracking-wide">Mapas 3D Custom</span>
        </div>
      </div>

      <!-- Left Card: Tarjeta 3D de Estadísticas (Z-30 para estar por encima de los pills) -->
      <div class="relative w-full max-w-[340px] group [perspective:1000px] z-30">
        <!-- Glow trasero -->
        <div class="absolute inset-0 bg-[#89F336] rounded-3xl blur-[60px] opacity-20 -z-10 group-hover:opacity-40 group-hover:blur-[80px] transition-all duration-700"></div>

        <!-- Tarjeta 3D -->
        <div class="w-full bg-[#0d0d0d] rounded-3xl overflow-hidden border border-[#89F336]/30 shadow-[0_20px_50px_rgba(0,0,0,0.5)] transition-transform duration-700 ease-out [transform:rotateY(15deg)_rotateX(8deg)] group-hover:[transform:rotateY(0deg)_rotateX(0deg)]">
          
          <!-- Header Image -->
          <div class="relative h-48 w-full border-b border-white/5">
            <img src="assets/img/squid_craft.png" alt="Features" class="w-full h-full object-cover opacity-70 group-hover:opacity-100 transition-opacity duration-500">
            
            <!-- Elementos UI del Header -->
            <div class="absolute top-5 left-5 text-[#89F336] text-sm drop-shadow-[0_0_10px_rgba(137,243,54,1)]">
              <i class="bi bi-asterisk"></i>
            </div>
            <div class="absolute top-5 left-12 flex gap-1.5 items-center">
              <div class="w-6 h-1.5 bg-white/90 rounded-full shadow-[0_0_5px_rgba(255,255,255,0.5)]"></div>
              <div class="w-3 h-1.5 bg-white/40 rounded-full"></div>
              <div class="w-1.5 h-1.5 bg-white/40 rounded-full"></div>
            </div>
            
            <!-- Título superpuesto -->
            <div class="absolute inset-0 flex items-center justify-center pt-6">
              <h3 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-b from-[#89F336] to-[#4a8a1a] tracking-tighter drop-shadow-[0_5px_10px_rgba(0,0,0,0.8)]" style="-webkit-text-stroke: 1px rgba(0,0,0,0.5);">FEATURES</h3>
            </div>
          </div>
          
          <!-- Action Bar (IPs / Links) -->
          <div class="flex gap-4 p-4 bg-[#111111] border-b border-white/5">
            <div class="flex items-center gap-2 text-[10px] text-gray-400 font-mono tracking-wider">
              <div class="w-5 h-5 rounded-md bg-[#89F336]/10 text-[#89F336] border border-[#89F336]/30 flex items-center justify-center"><i class="bi bi-controller"></i></div>
              play.infinity.fun
            </div>
            <div class="flex items-center gap-2 text-[10px] text-gray-400 font-mono tracking-wider">
              <div class="w-5 h-5 rounded-md bg-[#89F336]/10 text-[#89F336] border border-[#89F336]/30 flex items-center justify-center"><i class="bi bi-cart"></i></div>
              store.infinity.fun
            </div>
          </div>

          <!-- Estadísticas -->
          <div class="p-8 bg-[#0d0d0d]">
            <!-- Main pill destacado -->
            <div class="w-20 h-4 bg-gradient-to-r from-[#89F336] to-[#89F336]/50 rounded-full shadow-[0_0_15px_rgba(137,243,54,0.4)] mb-8 opacity-90"></div>
            
            <!-- Lista de stats en texto simple -->
            <div class="space-y-4 text-gray-300 font-mono text-sm tracking-wide">
              <div class="flex items-center gap-4">
                <div class="w-2.5 h-2.5 rounded-full bg-white/30"></div>
                <div class="flex gap-2">
                  <span class="text-[#89F336] font-bold">+50</span>
                  <span>Eventos</span>
                </div>
              </div>
              <div class="flex items-center gap-4">
                <div class="w-2.5 h-2.5 rounded-full bg-white/30"></div>
                <div class="flex gap-2">
                  <span class="text-[#89F336] font-bold">+10M</span>
                  <span>Espectadores</span>
                </div>
              </div>
              <div class="flex items-center gap-4">
                <div class="w-2.5 h-2.5 rounded-full bg-white/30"></div>
                <div class="flex gap-2">
                  <span class="text-[#89F336] font-bold">+500</span>
                  <span>Creadores</span>
                </div>
              </div>
              <div class="flex items-center gap-4">
                <div class="w-2.5 h-2.5 rounded-full bg-white/30"></div>
                <div class="flex gap-2">
                  <span class="text-[#89F336] font-bold">9</span>
                  <span>Años Exp.</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Floating Pills (Right side) -->
      <div class="hidden lg:flex flex-col gap-6 absolute top-1/2 -right-[240px] -translate-y-1/2 z-20">
        <div class="bg-[#111217] border border-white/5 shadow-2xl rounded-2xl p-3 pr-6 flex items-center gap-4 hover:scale-105 transition-transform cursor-pointer group whitespace-nowrap">
          <div class="w-10 h-10 rounded-full bg-green-500/20 flex items-center justify-center text-green-500 text-xl group-hover:bg-green-500/30 transition-colors"><i class="bi bi-people-fill"></i></div>
          <span class="text-white font-bold text-sm tracking-wide">Eventos Masivos</span>
        </div>
        <div class="bg-[#111217] border border-white/5 shadow-2xl rounded-2xl p-3 pr-6 flex items-center gap-4 hover:scale-105 transition-transform cursor-pointer group whitespace-nowrap mr-8">
          <div class="w-10 h-10 rounded-full bg-blue-500/20 flex items-center justify-center text-blue-500 text-xl group-hover:bg-blue-500/30 transition-colors"><i class="bi bi-shield-check"></i></div>
          <span class="text-white font-bold text-sm tracking-wide">Sistemas Anti-Cheat</span>
        </div>
      </div>

    </div>

    </div>



  </div>
</section>
