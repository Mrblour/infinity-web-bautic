<!-- Plataformas Section -->
<section class="relative z-10 w-full max-w-[1200px] px-8 mx-auto mb-20 pt-10">
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-[600px] h-[300px] bg-[#89F336]/5 blur-[120px] rounded-full pointer-events-none"></div>
  
  <div class="text-center mb-12 relative">
    <h2 class="text-4xl md:text-5xl font-bold text-white tracking-tight mb-4">
      Nuestras <span class="text-[#89F336]">Plataformas</span>
    </h2>
    <p class="text-[#a1a1aa] text-lg max-w-2xl mx-auto">
      Llevando nuestros eventos a todas las audiencias donde quiera que estén.
    </p>
  </div>

  <div class="grid grid-cols-2 md:grid-cols-4 gap-6 relative">
    <!-- Twitch -->
    <div onclick="flutcomModals.open('muy-pronto')" class="group relative bg-[#050505] rounded-3xl p-6 border border-white/5 hover:border-[#9146FF]/50 transition-all duration-500 hover:-translate-y-2 overflow-hidden flex flex-col items-center justify-center text-center cursor-pointer">
      <div class="absolute inset-0 bg-gradient-to-b from-[#9146FF]/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500 pointer-events-none"></div>
      <i class="bi bi-twitch text-5xl text-[#a1a1aa] group-hover:text-[#9146FF] transition-colors duration-300 mb-4"></i>
      <h4 class="text-xl font-bold text-white">Twitch</h4>
    </div>

    <!-- Kick -->
    <div onclick="flutcomModals.open('muy-pronto')" class="group relative bg-[#050505] rounded-3xl p-6 border border-white/5 hover:border-[#53FC18]/50 transition-all duration-500 hover:-translate-y-2 overflow-hidden flex flex-col items-center justify-center text-center cursor-pointer">
      <div class="absolute inset-0 bg-gradient-to-b from-[#53FC18]/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500 pointer-events-none"></div>
      <div class="text-5xl font-black text-[#a1a1aa] group-hover:text-[#53FC18] transition-colors duration-300 mb-4 tracking-tighter">K.</div>
      <h4 class="text-xl font-bold text-white">Kick</h4>
    </div>

    <!-- YouTube -->
    <div onclick="flutcomModals.open('muy-pronto')" class="group relative bg-[#050505] rounded-3xl p-6 border border-white/5 hover:border-[#FF0000]/50 transition-all duration-500 hover:-translate-y-2 overflow-hidden flex flex-col items-center justify-center text-center cursor-pointer">
      <div class="absolute inset-0 bg-gradient-to-b from-[#FF0000]/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500 pointer-events-none"></div>
      <i class="bi bi-youtube text-5xl text-[#a1a1aa] group-hover:text-[#FF0000] transition-colors duration-300 mb-4"></i>
      <h4 class="text-xl font-bold text-white">YouTube</h4>
    </div>

    <!-- TikTok -->
    <div onclick="flutcomModals.open('muy-pronto')" class="group relative bg-[#050505] rounded-3xl p-6 border border-white/5 hover:border-[#00f2fe]/50 transition-all duration-500 hover:-translate-y-2 overflow-hidden flex flex-col items-center justify-center text-center cursor-pointer">
      <div class="absolute inset-0 bg-gradient-to-b from-[#00f2fe]/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500 pointer-events-none"></div>
      <i class="bi bi-tiktok text-5xl text-[#a1a1aa] group-hover:text-white transition-all duration-300 mb-4 group-hover:drop-shadow-[-2px_-2px_0_#00f2fe] drop-shadow-[2px_2px_0_#ff0050]"></i>
      <h4 class="text-xl font-bold text-white">TikTok</h4>
    </div>
  </div>
</section>
