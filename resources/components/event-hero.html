  <!-- Background Banner for the Game -->
  <div class="absolute top-0 left-0 w-full h-[70vh] z-0 pointer-events-none">
    <!-- Generic background for projects -->
    <div class="absolute inset-0 bg-[#0a0a0a] opacity-50 bg-cover bg-center bg-no-repeat blur-sm"
      style="background-image: url('{{ bg_image }}');"></div>
    <div class="absolute inset-0 bg-gradient-to-b from-black/60 via-black/90 to-[#000000]"></div>
  </div>

  <!-- Hero Section -->
  <section class="relative z-10 w-full max-w-[1200px] px-8 mx-auto mt-10 animate-apple-text">

    <!-- Back Button -->
    <div class="flex items-center gap-3 mb-8">
      <a href="#proyectos" data-view="proyectos"
        class="px-4 py-2 bg-white/5 hover:bg-white/10 border border-white/10 rounded-full text-[#a1a1aa] hover:text-white transition-all text-sm flex items-center gap-2 backdrop-blur-md w-fit">
        <i class="bi bi-arrow-left"></i> Volver a Proyectos
      </a>
    </div>

    <div class="flex flex-col items-center gap-12 min-h-[40vh] w-full">
      <!-- Text Content -->
      <div class="w-full text-center md:text-left flex flex-col items-center md:items-start">
        <!-- Tags -->
        <div class="flex items-center gap-4 mb-6">
          <span
            class="px-4 py-1.5 bg-[#89F336]/20 text-[#89F336] text-xs font-bold rounded-full uppercase tracking-wider border border-[#89F336]/30">{{ tag1 }}</span>
          <span class="pl-10 pr-4 py-1.5 bg-white/5 text-white/70 text-xs font-bold rounded-full uppercase tracking-wider border border-white/10 relative flex items-center">
            <img src="assets/img/grass.png" alt="Minecraft" class="absolute -left-3 top-1/2 -translate-y-1/2 w-10 h-10 object-contain drop-shadow-[0_2px_10px_rgba(255,255,255,0.2)] hover:scale-110 hover:-rotate-12 transition-transform duration-300">
            {{ tag2 }}
          </span>
        </div>

        <!-- Title -->
        <h1 class="text-5xl md:text-7xl font-bold mb-6 tracking-tight text-white leading-tight drop-shadow-lg">
          {{ title }}
        </h1>

        <!-- Description -->
        <p class="text-xl text-[#a1a1aa] leading-relaxed max-w-3xl mb-10">
          {{ description }}
        </p>

        <!-- Actions -->
        <div class="flex flex-wrap gap-4 mb-4">
          <button
            class="px-8 py-3.5 bg-[#89F336] text-black font-bold rounded-full hover:bg-[#a3f55c] hover:scale-105 transition-all shadow-[0_0_20px_rgba(137,243,54,0.2)] flex items-center gap-2">
            <i class="bi bi-play-fill text-xl"></i> Ver Tráiler
          </button>
          <button
            class="relative px-8 py-3.5 bg-white/5 text-white font-bold rounded-full hover:bg-white/10 transition-all backdrop-blur-md flex items-center gap-2 group">
            <!-- Borde animado sin sombra -->
            <div class="absolute inset-0 rounded-full border border-white/50 animate-pulse pointer-events-none group-hover:border-white transition-colors duration-300"></div>
            <i class="bi bi-twitch text-lg relative z-10"></i> 
            <span class="relative z-10">Ver en Twitch</span>
          </button>
        </div>
      </div>

      <!-- Image Content -->
      <div class="w-full flex justify-center mt-4">
        <img src="{{ main_image }}" alt="{{ title }} Content"
          class="rounded-3xl shadow-2xl w-full max-w-4xl object-cover border border-white/5">
      </div>
    </div>
  </section>
